name: Seal Real Hermes Target

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character current main HEAD SHA already green in push CI
        required: true
      dashboard_url:
        description: Hermes Dashboard URL reachable from the self-hosted target runner
        required: true
        default: http://127.0.0.1:19119
      provider:
        description: Optional explicit Hermes provider for the real Run; provide together with model
        required: false
        default: ''
      model:
        description: Optional explicit Hermes model for the real Run; provide together with provider
        required: false
        default: ''
      reasoning_effort:
        description: Optional concrete reasoning effort (for example high/xhigh/max); requires provider + model and fails closed unless explicitly published
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: hws-real-target-seal-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  seal:
    name: Real Hermes target seal + exact-main verification
    runs-on: [self-hosted, hermes-seal]
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_SERVER_KEY: ${{ secrets.HERMES_SEAL_API_SERVER_KEY }}
      HWS_DASHBOARD_URL: ${{ inputs.dashboard_url }}
      HWS_SEAL_PROVIDER: ${{ inputs.provider }}
      HWS_SEAL_MODEL: ${{ inputs.model }}
      HWS_SEAL_REASONING_EFFORT: ${{ inputs.reasoning_effort }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Reject non-main, wrong or dirty candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ inputs.candidate_sha }}"

      - name: Close real target seal
        shell: bash
        run: |
          set -euo pipefail
          args=(--url "$HWS_DASHBOARD_URL")
          if [[ -n "${HWS_SEAL_PROVIDER:-}" || -n "${HWS_SEAL_MODEL:-}" ]]; then
            args+=(--provider "$HWS_SEAL_PROVIDER" --model "$HWS_SEAL_MODEL")
          fi
          if [[ -n "${HWS_SEAL_REASONING_EFFORT:-}" ]]; then
            args+=(--reasoning-effort "$HWS_SEAL_REASONING_EFFORT")
          fi
          python scripts/seal_close.py "${args[@]}"

      - name: Verify final seal verdict
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          verdict = json.loads(Path('.seal/SEALED.json').read_text(encoding='utf-8'))
          candidate = os.environ['CANDIDATE_SHA']
          if verdict.get('schema') != 'hermes-worker-studio.seal-verdict.v2':
              raise SystemExit(f"unexpected seal verdict schema: {verdict.get('schema')!r}")
          if verdict.get('eligible') is not True:
              raise SystemExit(f'seal verdict not eligible: {verdict}')
          if verdict.get('candidate_sha') != candidate:
              raise SystemExit(
                  f"seal candidate mismatch: expected {candidate}, got {verdict.get('candidate_sha')}"
              )
          print(f'SEALED evidence closed for exact main {candidate}')
          PY

      - name: Upload seal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-worker-studio-seal-${{ inputs.candidate_sha }}
          path: .seal/
          if-no-files-found: warn
          retention-days: 30

      - name: Final exact-main GitHub gate
        run: python scripts/github_finalize_seal.py --repo "$GITHUB_REPOSITORY" --candidate "${{ inputs.candidate_sha }}"
