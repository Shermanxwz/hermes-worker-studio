name: CI

on:
  push:
    branches: [main, feat/archive-grade-studio]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependency
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1'
      - name: Python syntax
        run: python -m py_compile __init__.py schemas.py tools.py dashboard/plugin_api.py scripts/verify_contract.py tests/test_plugin_api.py
      - name: Dashboard bundle syntax
        run: node --check dashboard/dist/index.js
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/run-worker-local.sh
      - name: Static archive contract
        run: python scripts/verify_contract.py
      - name: Run bridge unit tests
        run: python -m unittest -v tests/test_plugin_api.py
      - name: Manifest JSON
        run: python -m json.tool dashboard/manifest.json >/dev/null
