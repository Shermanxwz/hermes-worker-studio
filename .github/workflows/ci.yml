name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hws-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_PIN: 4f22543509d1b91dc45bcb369447126c5eb14fb7
  WORKER_PIN: e965517e5bddeda57f5bc2b015a817279ea8e6e5

jobs:
  studio-contract:
    name: Studio static + integration + UI runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install test-only Python dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.28,<1'

      - name: Install pinned frontend test harness
        run: npm install --ignore-scripts --no-fund

      - name: Python compile gate
        run: python -m compileall -q __init__.py schemas.py tools.py dashboard scripts tests

      - name: JavaScript syntax gate
        run: |
          node --check dashboard/dist/index.js
          node --check tests/frontend_runtime.mjs

      - name: Shell syntax gate
        run: bash -n scripts/install.sh scripts/run-worker-local.sh

      - name: Static archive contract
        run: python scripts/verify_contract.py

      - name: Python unit + HTTP integration + installer tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Dashboard runtime behavior integration
        run: npm run test:frontend

      - name: Manifest JSON gate
        run: python -m json.tool dashboard/manifest.json >/dev/null

      - name: High severity npm audit
        run: npm audit --audit-level=high

  upstream-contracts:
    name: Pinned Hermes + Worker public contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PIN }}
          path: .upstream/hermes
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Shermanxwz/codex-worker-delegation
          ref: ${{ env.WORKER_PIN }}
          path: .upstream/worker
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact upstream revisions and public contracts
        run: python scripts/verify_upstreams.py --hermes-root .upstream/hermes --worker-root .upstream/worker

  worker-upstream-seal:
    name: Worker upstream tests + live control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Shermanxwz/codex-worker-delegation
          ref: ${{ env.WORKER_PIN }}
          path: .upstream/worker
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Worker own full tests
        run: npm --prefix .upstream/worker test

      - name: Worker own check gate
        run: npm --prefix .upstream/worker run check

      - name: Worker production seal fails closed without target-machine evidence
        shell: bash
        run: |
          set +e
          output="$(npm --prefix .upstream/worker run seal:production 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ $status -eq 0 ]]; then
            echo 'Hosted runner unexpectedly produced a production seal without target-machine evidence.' >&2
            exit 1
          fi
          grep -q '"status": "NOT_SEALED"' <<<"$output"

      - name: Worker archive seal fails closed without target-machine evidence
        shell: bash
        run: |
          set +e
          output="$(npm --prefix .upstream/worker run seal:archive 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ $status -eq 0 ]]; then
            echo 'Hosted runner unexpectedly produced an archive seal without target-machine evidence.' >&2
            exit 1
          fi
          grep -q '"status": "NOT_ARCHIVE_READY"' <<<"$output"

      - name: Install Studio smoke dependency
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1'

      - name: Start pinned real Worker control plane
        env:
          CWD_HOST: 127.0.0.1
          CWD_PORT: '8788'
          CWD_REQUIRE_AUTH: '0'
          CWD_ALLOW_DANGER_FULL_ACCESS: '1'
          HOME: ${{ runner.temp }}/worker-home
        run: |
          mkdir -p "$HOME"
          node .upstream/worker/src/server.mjs >"${RUNNER_TEMP}/worker.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/worker.pid"
          for i in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:8788/api/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "${RUNNER_TEMP}/worker.log"
          exit 1

      - name: Studio against pinned real Worker
        env:
          HERMES_WORKER_STUDIO_WORKER_URL: http://127.0.0.1:8788
          HERMES_WORKER_STUDIO_ALLOW_REMOTE: '0'
        run: python tests/real_worker_smoke.py

      - name: Stop Worker and retain diagnostics
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/worker.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/worker.pid")" 2>/dev/null || true
          fi
          echo '--- worker log ---'
          cat "${RUNNER_TEMP}/worker.log" 2>/dev/null || true

  hermes-real-plugin-doctor:
    name: Hermes real Plugin Doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PIN }}
          path: .upstream/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Hermes runtime in supported developer mode
        working-directory: .upstream/hermes
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run Hermes runtime-backed Plugin Doctor on Studio
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('.upstream/hermes').resolve()))
          from hermes_cli.plugin_dev import doctor_plugin
          report = doctor_plugin('.')
          print(report.format_text())
          if not report.ok:
              raise SystemExit(1)
          expected = {'worker_delegate', 'worker_status', 'worker_catalog'}
          actual = set(report.registered_tools)
          if actual != expected:
              raise SystemExit(f'registered tool mismatch: expected {sorted(expected)}, got {sorted(actual)}')
          PY

  production-security:
    name: Production security static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check 'bandit>=1.8,<2'
      - name: Bandit production Python
        # B310 is deliberately excluded: every urlopen target is first passed
        # through _validate_upstream/_safe_url, whose http(s), credential and
        # loopback policy is separately unit/integration tested.
        run: bandit -q -s B310 -r dashboard/plugin_api.py tools.py __init__.py schemas.py
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          ! grep -RInE --exclude='*.md' --exclude='*.example' --exclude='frontend_runtime.mjs' '(sk-[A-Za-z0-9_-]{20,}|API_SERVER_KEY=[^<[:space:]]{12,}|CWD_WEB_TOKEN=[^<[:space:]]{12,})' .
