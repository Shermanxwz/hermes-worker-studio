name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hws-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_PIN: 9eb832aad74547aaa0c4e6b4c1fab11f7d6a4bea

jobs:
  studio-contract:
    name: Studio static + unit + UI runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install test-only Python dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.28,<1'

      - name: Install pinned frontend harness
        run: npm install --ignore-scripts --no-fund

      - name: Python compile gate
        run: python -m compileall -q __init__.py schemas.py tools.py dashboard scripts tests

      - name: JavaScript syntax gate
        run: |
          node --check dashboard/dist/index.js
          node --check dashboard/dist/gateway-native.js
          node --check dashboard/dist/index-v3.js
          node --check tests/frontend_runtime.mjs
          node --check tests/frontend_runtime_v3.mjs
          node --check tests/frontend_gateway_native.mjs
          node --check tests/frontend_product_v3.mjs
          node --check tests/frontend_settings_v3.mjs
          node --check tests/frontend_context_plan_v3.mjs
          node --check playwright.seal.config.mjs
          node --check tests/target_ui.spec.mjs

      - name: Shell syntax gate
        run: bash -n scripts/install.sh

      - name: Archive + product architecture contract
        run: python scripts/verify_contract.py

      - name: Python unit + HTTP integration + installer tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Exact staged release artifact gate
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp dashboard/dist/index-v3.js "$tmp/index-v3.js"
          cp dashboard/plugin_api_v3.py "$tmp/plugin_api_v3.py"
          python scripts/stage_product_bundle.py "$tmp/index-v3.js"
          python scripts/stage_mixed_protocol.py "$tmp/index-v3.js" "$tmp/plugin_api_v3.py"
          node --check "$tmp/index-v3.js"
          python -m py_compile "$tmp/plugin_api_v3.py"
          grep -Fq "resolveProtocolExecutionRoute" "$tmp/index-v3.js"
          grep -Fq "role: 'alert'" "$tmp/index-v3.js"
          grep -Fq "event.key === 'Escape'" "$tmp/index-v3.js"
          grep -Fq "@router.post(\"/hermes/protocols/resolve\")" "$tmp/plugin_api_v3.py"
          ! grep -Fq "请先进入“模型”页面点击“官方探测”" "$tmp/index-v3.js"

      - name: Dashboard product-flow runtime integration
        run: npm run test:frontend

      - name: Seal command CLI gates
        run: |
          python scripts/seal_acceptance.py --help >/dev/null
          python scripts/verify_seal_evidence.py --help >/dev/null
          python scripts/seal_upstream_gate.py --help >/dev/null
          python scripts/seal_close.py --help >/dev/null
          python scripts/github_finalize_seal.py --help >/dev/null

      - name: Dashboard manifest JSON gate
        run: python -m json.tool dashboard/manifest.json >/dev/null

      - name: High severity npm audit
        run: npm audit --audit-level=high

  hermes-upstream-contract:
    name: Pinned Hermes archive public contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PIN }}
          path: .upstream/hermes
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact revision and documented archive semantics
        run: python scripts/verify_upstreams.py --hermes-root .upstream/hermes
      - name: Verify official Hermes Web branding asset
        run: test -s .upstream/hermes/web/public/favicon.ico

  hermes-native-contract:
    name: Hermes lifecycle + Gateway attachments + Runs + approvals + Plugin Doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PIN }}
          path: .upstream/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Hermes runtime and upstream-test dependencies
        working-directory: .upstream/hermes
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check \
            'pytest==9.1.1' \
            'pytest-asyncio==1.3.0' \
            'aiohttp==3.14.3'

      - name: Run Hermes own lifecycle, Gateway, attachment and approval tests
        working-directory: .upstream/hermes
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-upstream-test-home
        run: |
          python -m pytest -q \
            tests/agent/test_subagent_lifecycle.py \
            tests/gateway/test_api_server_runs.py \
            tests/tools/test_approval.py \
            tests/tui_gateway/test_todo_state_events.py \
            tests/tui_gateway/test_attach_does_not_wait_for_agent.py \
            tests/agent/test_context_breakdown.py

      - name: Run Hermes Plugin Doctor on Studio
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('.upstream/hermes').resolve()))
          from hermes_cli.plugin_dev import doctor_plugin
          report = doctor_plugin('.')
          print(report.format_text())
          if not report.ok:
              raise SystemExit(1)
          expected = {'worker_delegate', 'worker_status', 'worker_catalog'}
          actual = set(report.registered_tools)
          if actual != expected:
              raise SystemExit(f'registered tool mismatch: expected {sorted(expected)}, got {sorted(actual)}')
          PY

  production-security:
    name: Production security + dependency boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check 'bandit>=1.8,<2'
      - name: Bandit production Python
        run: bandit -q -s B310 -r dashboard/plugin_api.py dashboard/plugin_api_v3.py tools.py __init__.py schemas.py scripts/stage_product_bundle.py scripts/stage_mixed_protocol.py
      - name: Reject committed bearer secrets
        shell: bash
        run: |
          ! grep -RInE --exclude='*.md' --exclude='*.example' --exclude='frontend_runtime.mjs' --exclude='frontend_runtime_v3.mjs' --exclude='frontend_gateway_native.mjs' --exclude='frontend_product_v3.mjs' --exclude='frontend_settings_v3.mjs' '(sk-[A-Za-z0-9_-]{20,}|API_SERVER_KEY=[^<[:space:]]{12,})' .
      - name: Reject a second execution runtime in production files
        shell: bash
        run: |
          legacy_repo='codex-worker-delegation'
          legacy_port=':8788'
          legacy_env='CWD_'
          files=(plugin.yaml __init__.py schemas.py tools.py dashboard/manifest.json dashboard/plugin_api.py dashboard/plugin_api_v3.py dashboard/dist/gateway-native.js dashboard/dist/index-v3.js dashboard/dist/product.css dashboard/dist/product-sealed.css dashboard/dist/product-closure.css scripts/install.sh scripts/stage_product_bundle.py scripts/stage_mixed_protocol.py deploy/worker-studio.env.example)
          for token in "$legacy_repo" "$legacy_port" "$legacy_env"; do
            if grep -FIn -- "$token" "${files[@]}"; then
              echo "forbidden parallel-runtime token found: $token" >&2
              exit 1
            fi
          done
