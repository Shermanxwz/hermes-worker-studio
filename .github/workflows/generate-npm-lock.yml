name: Generate npm lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/generate-npm-lock.yml

permissions:
  contents: write

# Temporary seal utility: removed after package-lock.json is committed.
jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate exact test-harness lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error(`expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          const root = lock.packages?.[''];
          if (!root || root.name !== pkg.name || root.version !== pkg.version) throw new Error('lock root identity mismatch');
          if (JSON.stringify(root.devDependencies) !== JSON.stringify(pkg.devDependencies)) throw new Error('lock root devDependencies mismatch');
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            if (root[field] && Object.keys(root[field]).length) throw new Error(`root ${field} must remain empty`);
          }
          NODE
      - name: Commit verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already matches the verified dependency graph'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Seal frontend test harness lockfile'
          git push origin HEAD:main
