manifest_version: 2
api_version: 1
name: hermes-worker-studio
version: 3.0.0
description: Product-grade Hermes-native worker studio built only on documented Hermes plugin, dashboard, Runs, model, approvals, session, and subagent lifecycle contracts.
provides_tools:
  - worker_delegate
  - worker_status
  - worker_catalog
provides_hooks:
  - pre_tool_call
config_schema:
  mode:
    type: str
    default: AUTO
    description: "Studio delegation policy: OFFICIAL, AUTO, DELEGATE, or MAIN."
